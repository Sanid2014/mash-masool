<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="وكالة مش مسؤول — Mash Mas'ool Agency" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>وكالة مش مسؤول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      height: -webkit-fill-available;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0A0A0F;
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    #root {
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    /* Prevent iOS input zoom */
    input, select, textarea {
      font-size: 16px !important;
    }
    /* Smooth scrolling on iOS */
    * {
      -webkit-overflow-scrolling: touch;
    }
    /* Remove tap highlights on interactive elements */
    button, a, [role="button"] {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    @keyframes slideDownFade {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0)     scale(1);    }
    }
    /* Backdrop-filter fallback for unsupported browsers */
    @supports not (backdrop-filter: blur(1px)) {
      .blur-fallback {
        background: rgba(10,8,20,0.98) !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
